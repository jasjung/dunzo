[project]
name = "dunzo"
version = "0.2.1"
description = "Tiny completion sounds for Python scripts and the command line."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["audio", "cli", "notification", "sound"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
done = "dunzo.cli:main"
dunzo = "dunzo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dunzo*"]

[tool.setuptools.package-data]
dunzo = [
    "sound_effects/positive.mp3",
    "sound_effects/success.mp3",
    "sound_effects/trumpet.mp3",
]

[tool.ruff]
line-length = 95
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
